  <!-- 3. Mobile Phone View (Left Foreground) -->
  <g transform="translate(22, 202) rotate(-6)">
    <rect x="0" y="0" width="96" height="186" rx="16" fill="#090a0d" stroke="#525767" stroke-width="3"/>
    <rect x="6" y="7" width="84" height="172" rx="12" fill="#180909"/>
    <!-- Dynamic Island -->
    <rect x="33" y="11" width="30" height="5" rx="2.5" fill="#000000"/>
    <!-- Mobile Screen Content -->
    <rect x="13" y="24" width="46" height="7" rx="3.5" fill="#ef4444"/>
    <rect x="13" y="37" width="70" height="42" rx="6" fill="#ef4444" fill-opacity="0.22" stroke="#ef4444" stroke-opacity="0.45"/>
    <text x="19" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="900">Malai Boti</text>
    <text x="19" y="68" fill="#ef4444" font-family="Arial, sans-serif" font-size="7.5" font-weight="800">6+ Menus</text>
    <rect x="13" y="86" width="70" height="38" rx="6" fill="#ffffff" fill-opacity="0.07"/>
    <text x="19" y="103" fill="#ffffff" font-family="Arial, sans-serif" font-size="7.5" font-weight="800">Chicken Tikka</text>
    <text x="19" y="115" fill="#f59e0b" font-family="Arial, sans-serif" font-size="7" font-weight="700">Live BBQ</text>
    <rect x="13" y="131" width="70" height="36" rx="6" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="19" y="148" width="58" height="12" rx="6" fill="#ef4444"/>
  </g>

  <!-- Bottom Gradient Overlay & Typography -->
  <rect width="400" height="560" rx="22" fill="url(#cardFade_08)"/>

  <text x="26" y="474" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="34" font-weight="900" letter-spacing="0.5">HOT N SPICY</text>
  <text x="26" y="502" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="12.5" font-weight="500">Authentic Charcoal BBQ, Karahi & Fast Food</text>

  <!-- Neon Green Corner Badge -->
  <circle cx="354" cy="482" r="22" fill="#39FF14"/>
  <path d="M347 489L361 475M361 475H349M361 475V487" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>