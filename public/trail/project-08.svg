    <text x="26" y="48" fill="#ef4444" font-family="Arial, sans-serif" font-size="6.5" font-weight="800">DESI DINING • LIVE</text>
    <text x="20" y="68" fill="#ffffff" font-family="Arial, sans-serif" font-size="13.5" font-weight="900">SIZZLING BBQ & KARAHI</text>
    <text x="20" y="83" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="8.5" font-weight="500">Wah Cantt • Live Charcoal Grill & Rolls</text>
    <!-- Mini CTA Buttons -->
