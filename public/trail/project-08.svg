       MULTI-DEVICE SHOWCASE (TABLET + LAPTOP + MOBILE)
       ========================================== -->

  <!-- 1. Tablet View (Right Back) -->
  <g transform="translate(215, 118) rotate(8)">
    <rect x="0" y="0" width="148" height="190" rx="12" fill="#0d0e12" stroke="#454956" stroke-width="3"/>
    <rect x="7" y="9" width="134" height="172" rx="7" fill="#180909"/>
    <rect x="14" y="18" width="60" height="8" rx="4" fill="#ef4444"/>
    <rect x="14" y="34" width="116" height="44" rx="6" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="22" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="800">Malai Boti</text>
    <text x="22" y="68" fill="#ef4444" font-family="Arial, sans-serif" font-size="8" font-weight="700">6+ Menus</text>
    <rect x="14" y="86" width="55" height="60" rx="5" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="75" y="86" width="55" height="60" rx="5" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="14" y="154" width="116" height="18" rx="5" fill="#f59e0b" fill-opacity="0.25"/>
