<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" fill="none">
  <defs>
    <linearGradient id="bg_08" x1="0" y1="0" x2="400" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#160505"/>
      <stop offset="55%" stop-color="#3b0a0a"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
    <radialGradient id="glow_08" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardFade_08" x1="200" y1="0" x2="200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Card Background & Ambient Brand Glow -->
  <rect width="400" height="560" rx="22" fill="url(#bg_08)"/>
  <rect width="400" height="560" rx="22" fill="url(#glow_08)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="110" x2="400" y2="110"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="0" y1="420" x2="400" y2="420"/>
    <line x1="100" y1="0" x2="100" y2="560"/>
    <line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="300" y1="0" x2="300" y2="560"/>
  </g>

  <!-- Top Badges Row -->
  <rect x="22" y="22" width="44" height="28" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="44" y="41" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">08</text>

  <rect x="202" y="22" width="88" height="28" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="246" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Desi Dining</text>

  <rect x="296" y="22" width="82" height="28" rx="8" fill="#ef4444" fill-opacity="0.22" stroke="#ef4444" stroke-opacity="0.5"/>
  <text x="337" y="40" fill="#ef4444" font-family="Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Menu Engine</text>

