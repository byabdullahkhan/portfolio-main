      <rect x="0" y="0" width="76" height="48" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ef4444" stroke-opacity="0.35"/>
      <rect x="6" y="6" width="64" height="16" rx="3" fill="#ef4444" fill-opacity="0.25"/>
      <text x="8" y="34" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="800">Malai Boti</text>
      <text x="8" y="43" fill="#ef4444" font-family="Arial, sans-serif" font-size="7" font-weight="700">6+ Menus</text>

      <rect x="84" y="0" width="76" height="48" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="90" y="6" width="64" height="16" rx="3" fill="#f59e0b" fill-opacity="0.25"/>
      <text x="92" y="34" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="800">Chicken Tikka</text>
      <text x="92" y="43" fill="#f59e0b" font-family="Arial, sans-serif" font-size="7" font-weight="700">Live BBQ</text>

      <rect x="168" y="0" width="76" height="48" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="174" y="6" width="64" height="16" rx="3" fill="#ef4444" fill-opacity="0.2"/>
      <text x="176" y="34" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="800">Seekh Kebab</text>
      <text x="176" y="43" fill="#ef4444" font-family="Arial, sans-serif" font-size="7" font-weight="700">Fast Delivery</text>
